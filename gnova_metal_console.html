<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-NOVA LABS</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #1d1d1f; --accent-light: #f5f5f5; --ink: #1d1d1f;
      --cream: #ffffff; --white: #ffffff; --line: #e5e5ea; --muted: #6e6e73;
    }
    body.dark {
      --accent: #1d1d1f; --accent-light: #2a2a2d; --cream: #0e1117;
      --ink: #f0ede6; --white: #181c27; --line: #2a2e3d; --muted: #a8a4b0;
    }
    html, body { width:100%; height:100%; overflow:hidden; font-family:"Pretendard",sans-serif; background:var(--cream); color:var(--ink); }
    .header { height:56px; background:var(--white); border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:0 16px; }
    .logo-btn { border:none; background:transparent; cursor:pointer; display:inline-flex; align-items:center; }
    .logo-btn img { height:44px; width:auto; object-fit:contain; display:block; mix-blend-mode: multiply; clip-path: inset(2px); }
    .top-nav { display:flex; justify-content:center; gap:6px; }
    .nav-btn { border:none; background:transparent; color:var(--muted); border-radius:8px; height:34px; padding:0 14px; font-size:13px; font-weight:600; cursor:pointer; transition:180ms ease; }
    .nav-btn:hover, .nav-btn.active { background:var(--accent); color:#fff; }
    body.dark .nav-btn { color:var(--ink); }
    .header-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .btn-line, .btn-fill { border-radius:9px; font-size:12px; font-weight:600; height:34px; padding:0 12px; cursor:pointer; }
    .btn-line { border:1px solid var(--line); background:var(--white); color:var(--ink); }
    .btn-fill { border:1px solid var(--accent); background:var(--accent); color:#fff; }
    .app { position:relative; width:100%; height:calc(100vh - 56px); overflow:hidden; background:var(--cream); }
    .state { position:absolute; inset:0; opacity:0; pointer-events:none; transform:translateY(4px); transition:opacity 220ms ease,transform 220ms ease; }
    .state.active { opacity:1; pointer-events:auto; transform:translateY(0); }

    /* STATE 1 */
    .hero-layout { height:100%; display:grid; grid-template-rows:1fr 60px 1fr; }
    /* ─── WHITE ROBOT HERO ─── */
    .hero-top { background:var(--cream); position:relative; overflow:hidden; }
    /* Spline: Robot */
    .spline-hero { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:auto; }
    .spline-hero iframe { width:100%; height:100%; border:none; }
    .spline-watermark-hide { position:absolute; bottom:0; right:0; width:160px; height:50px; background:var(--cream); z-index:10; pointer-events:none; }
    .hero-fade { background:linear-gradient(to bottom, transparent, var(--cream)); height:40px; margin-top:-40px; position:relative; z-index:5; pointer-events:none; }
    .hero-bottom { background:var(--cream); padding:18px 22px 20px; overflow:auto; display:flex; flex-direction:column; align-items:center; gap:14px; }
    .hero-copy { width:min(80%,920px); }
    .hero-copy h1 { font-size:28px; font-weight:700; color:var(--ink); margin-bottom:8px; letter-spacing:-0.02em; }
    .hero-copy p { font-size:14px; color:var(--muted); margin-bottom:24px; }
    .ai-search { width:min(80%,920px); background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .search-row { display:flex; gap:10px; }
    .search-input { flex:1; height:46px; border:1px solid var(--line); border-radius:11px; background:#fff; color:#1f1f1f; padding:0 13px; font-size:14px; outline:none; }
    .search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(29,29,31,0.12); }
    .send-btn { height:46px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:11px; padding:0 16px; font-weight:700; cursor:pointer; }
    .chips { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .chip { border:none; border-radius:999px; background:#ebe7df; color:#4e4e4e; padding:6px 11px; font-size:12px; cursor:pointer; transition:160ms ease; }
    .chip:hover { background:var(--accent); color:#fff; }
    .home-cards { width:min(80%,920px); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .home-card { border:1px solid var(--line); background:var(--white); border-radius:14px; padding:16px; cursor:pointer; transition:transform 200ms ease,border-color 200ms ease; }
    .home-card:hover { transform:translateY(-2px); border-color:var(--accent); }
    .home-card h3 { font-size:16px; margin-bottom:5px; }
    .home-card p { color:var(--muted); font-size:12px; line-height:1.5; }

    /* STATE 2 */
    .cat-layout { height:100%; display:grid; grid-template-columns:220px 1fr; background:var(--cream); }
    .sidebar { background:var(--white); border-right:1px solid var(--line); overflow:auto; padding:10px 0; }
    .back-home { width:calc(100% - 20px); margin:0 10px 10px; border:none; background:#f5f3ee; color:#555; border-radius:9px; text-align:left; padding:8px 10px; font-size:12px; cursor:pointer; }
    .sub-label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:4px 16px 6px; }
    .sub-btn { width:100%; border:none; border-left:3px solid transparent; background:transparent; text-align:left; color:#484848; font-size:13px; padding:10px 14px; cursor:pointer; }
    .sub-btn:hover { background:var(--accent-light); }
    .sub-btn.active { border-left-color:var(--accent); background:#f5f3ee; color:var(--accent); font-weight:600; }
    body.dark .sub-btn { color:var(--ink); }
    body.dark .sub-btn.active { color:var(--white); background:var(--ink); border-left-color:var(--ink); }
    .cat-main { overflow-y:auto; padding:22px; background:var(--cream); }
    .cat-main h1 { font-size:25px; margin-bottom:4px; }
    .cat-main p { color:var(--muted); font-size:14px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .service-card { border:1px solid var(--line); border-radius:14px; background:var(--white); padding:24px; cursor:pointer; transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease; }
    .service-card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 4px 16px rgba(0,0,0,0.08); }
    .card-kicker { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
    .card-title { font-size:17px; font-weight:700; margin-bottom:8px; }
    .card-desc { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:10px; }
    .status-badge { display:inline-block; border-radius:999px; font-size:11px; padding:4px 10px; font-weight:600; }
    .status-live { background:#e8f4e8; color:#1a6a1a; }
    .status-ready { background:#f5f5f5; color:#6e6e73; }
    body.dark .card-title, body.dark .card-desc, body.dark .status-badge { color:var(--ink); }

    /* STATE 3 */
    .detail { height:100%; display:grid; grid-template-columns:60% 40%; overflow:hidden; background:var(--cream); }
    .detail-left, .detail-right { height:100%; overflow:auto; padding:26px 28px; }
    .detail-left { border-right:1px solid var(--line); }
    .back-detail { border:1px solid var(--line); background:var(--white); color:#555; border-radius:10px; padding:8px 13px; font-size:13px; cursor:pointer; margin-bottom:16px; }
    .detail-title { font-size:31px; margin-bottom:10px; }
    .detail-divider { height:1px; background:var(--line); margin:10px 0 14px; }
    .detail-left h2 { font-size:20px; margin-bottom:10px; }
    .detail-left p { max-width:800px; color:var(--muted); line-height:1.75; margin-bottom:12px; font-size:15px; }
    .feature-list { list-style:none; margin-top:8px; }
    .feature-list li { color:var(--muted); margin-bottom:8px; font-size:14px; line-height:1.6; }
    .feature-list li::before { content:"• "; color:var(--ink); font-weight:700; }
    .form-card { border:1px solid var(--line); border-radius:14px; background:var(--white); padding:18px; }
    .form-card h3 { margin-bottom:10px; font-size:18px; }
    .form-group { display:grid; gap:8px; }
    .form-group input, .form-group textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:13px; font-family:inherit; background:#fff; color:#222; outline:none; }
    .form-group textarea { resize:vertical; min-height:100px; line-height:1.5; }
    .submit-btn { width:100%; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; height:42px; font-weight:700; cursor:pointer; margin-top:4px; }

    /* MODAL */
    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.42); z-index:500; padding:14px; }
    .modal.open { display:flex; }
    .modal-card { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; position:relative; }
    .close-x { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13px; }
    .modal-card h3 { margin-bottom:10px; font-size:18px; }
    .login-btn { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; text-align:left; padding:10px 12px; cursor:pointer; margin-bottom:8px; }
    .divider { height:1px; background:var(--line); margin:8px 0; }
    .email-group { display:grid; gap:8px; }
    .email-group input { height:40px; border:1px solid var(--line); border-radius:10px; padding:0 11px; font-size:13px; outline:none; }
    .email-group .submit { height:40px; border:1px solid var(--accent); border-radius:10px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <header class="header">
    <button class="logo-btn" id="goHomeBtn" title="홈">
      <img src="gnova_hypercar_logo_2.png" alt="G-NOVA">
    </button>
    <nav class="top-nav" id="topNav"></nav>
    <div class="header-right">
      <button class="btn-line" id="goSalesBtn">템플릿 판매 페이지</button>
      <button class="btn-line" id="darkBtn">다크모드</button>
      <button class="btn-fill" id="signInBtn">로그인</button>
    </div>
  </header>

  <main class="app">
    <section class="state active" id="stateHome">
      <div class="hero-layout">
        <div class="hero-top">
          <!-- Spline Robot 3D -->
          <div class="spline-hero">
            <iframe src="https://my.spline.design/nexbotrobotcharacterconcept-2b28cfd52a2ff82bc9250a2de22c2a12/" frameborder="0" allowfullscreen></iframe>
            <!-- Hide Spline Watermark -->
            <div class="spline-watermark-hide"></div>
          </div>
        </div>
        <div class="hero-fade"></div>
        <div class="hero-bottom">
          <div class="hero-copy">
            <h1>AI로 비즈니스를 다시 설계합니다</h1>
            <p>가상 스테이징 · 블로그 자동화 · AI 컨설팅 · 경매 분석</p>
          </div>
          <div class="ai-search">
            <div class="search-row">
              <input class="search-input" id="searchInput" placeholder="G-NOVA AI에게 물어보세요...">
              <button class="send-btn" id="searchSendBtn">전송</button>
            </div>
            <div class="chips">
              <button class="chip">가상 스테이징이란?</button>
              <button class="chip">블로그 자동화 가격?</button>
              <button class="chip">AI 도입 상담</button>
            </div>
          </div>
          <div class="home-cards" id="homeCards"></div>
        </div>
      </div>
    </section>

    <section class="state" id="stateCategory">
      <div class="cat-layout">
        <aside class="sidebar">
          <button class="back-home" id="backHomeBtn">← 홈으로</button>
          <div class="sub-label" id="subLabel">서비스 안내</div>
          <div id="subMenu"></div>
        </aside>
        <div class="cat-main">
          <h1 id="catHeading">서비스 안내</h1>
          <p id="catDescription">소카테고리를 선택하면 상세 항목을 확인할 수 있습니다.</p>
          <div class="grid" id="catGrid"></div>
        </div>
      </div>
    </section>

    <section class="state" id="stateDetail">
      <div class="detail">
        <div class="detail-left">
          <button class="back-detail" id="backCatBtn">← 뒤로</button>
          <h1 class="detail-title" id="detailTitle"></h1>
          <div class="detail-divider"></div>
          <h2>상세 안내</h2>
          <p id="detailParagraph1"></p>
          <p id="detailParagraph2"></p>
          <ul class="feature-list" id="detailFeatures"></ul>
        </div>
        <div class="detail-right">
          <div class="form-card">
            <h3>상담 신청</h3>
            <div class="form-group">
              <input placeholder="이름">
              <input placeholder="연락처">
              <textarea rows="4" placeholder="문의내용"></textarea>
              <button class="submit-btn" id="detailCtaBtn">무료 상담 신청</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="loginModal">
    <div class="modal-card">
      <button class="close-x" id="closeModalX">✕</button>
      <h3>Sign In</h3>
      <button class="login-btn">Google 로그인</button>
      <button class="login-btn">Naver 로그인</button>
      <button class="login-btn">Kakao 로그인</button>
      <div class="divider"></div>
      <div class="email-group">
        <input placeholder="이메일">
        <input placeholder="비밀번호" type="password">
        <button class="submit">로그인</button>
      </div>
    </div>
  </div>

  <script>
    const data = {
      "서비스 안내": {
        description: "운영중 서비스와 준비중 항목을 확인하세요.",
        subs: {
          "부동산 스테이징": [
            { title: "매물 사진 고급화", desc: "매물 사진을 판매용 비주얼로 고급화합니다.", status: "운영중" },
            { title: "상담 전환 랜딩", desc: "문의 유입 중심 랜딩 구조를 제공합니다.", status: "운영중" }
          ],
          "블로그 자동화": [
            { title: "키워드 기반 글 생성", desc: "핵심 키워드로 자동 글 초안을 생성합니다.", status: "운영중" },
            { title: "콘텐츠 일정 운영", desc: "지속 발행을 위한 운영 흐름을 지원합니다.", status: "운영중" }
          ],
          "기업 웹사이트": [
            { title: "신뢰형 메인 페이지", desc: "기업 신뢰 중심의 메인 페이지를 구축합니다.", status: "운영중" },
            { title: "문의 중심 구성", desc: "상담 전환률에 초점을 맞춘 구조입니다.", status: "운영중" }
          ],
          "이미지 자동화 (준비중)": [
            { title: "썸네일 자동 제작", desc: "채널별 썸네일 제작 자동화를 준비중입니다.", status: "준비중" },
            { title: "제품컷 보정", desc: "상품컷 자동 보정 기능을 준비중입니다.", status: "준비중" }
          ],
          "영상 생성 자동화 (준비중)": [
            { title: "숏폼 자동 생성", desc: "짧은 홍보 영상 자동 생성 기능을 준비중입니다.", status: "준비중" },
            { title: "자막/포맷 변환", desc: "플랫폼별 자막/비율 자동 변환 기능을 준비중입니다.", status: "준비중" }
          ]
        }
      },
      "무료 프롬프트": {
        description: "이미지/영상 생성용 무료 프롬프트 카테고리입니다.",
        subs: {
          "이미지 프롬프트": [
            { title: "브랜드형 이미지 프롬프트", desc: "브랜드 톤 기반 이미지 생성용 기본 템플릿.", status: "운영중" },
            { title: "제품 컷 프롬프트", desc: "상세페이지 제품 컷 생성용 템플릿.", status: "운영중" }
          ],
          "영상 프롬프트": [
            { title: "숏폼 영상 프롬프트", desc: "15~30초 숏폼 제작용 템플릿.", status: "운영중" },
            { title: "리뷰/후기 영상 프롬프트", desc: "후기 중심 영상 구성 템플릿.", status: "운영중" }
          ]
        }
      }
    };

    let activeCategory = "서비스 안내";
    let activeSub = "부동산 스테이징";

    const stateHome = document.getElementById("stateHome");
    const stateCategory = document.getElementById("stateCategory");
    const stateDetail = document.getElementById("stateDetail");
    const topNav = document.getElementById("topNav");
    const homeCards = document.getElementById("homeCards");
    const subLabel = document.getElementById("subLabel");
    const subMenu = document.getElementById("subMenu");
    const catHeading = document.getElementById("catHeading");
    const catDescription = document.getElementById("catDescription");
    const catGrid = document.getElementById("catGrid");
    const detailFeatures = document.getElementById("detailFeatures");
    const loginModal = document.getElementById("loginModal");

    function showState(target) {
      stateHome.classList.remove("active");
      stateCategory.classList.remove("active");
      stateDetail.classList.remove("active");
      if (target === "home") stateHome.classList.add("active");
      else if (target === "category") stateCategory.classList.add("active");
      else if (target === "detail") stateDetail.classList.add("active");
    }

    function renderTopNav() {
      topNav.innerHTML = "";
      Object.keys(data).forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.onclick = () => {
          activeCategory = cat;
          activeSub = Object.keys(data[cat].subs)[0];
          renderTopNav();
          renderCategory();
          showState("category");
        };
        topNav.appendChild(btn);
      });
    }

    function renderHomeCards() {
      homeCards.innerHTML = "";
      Object.keys(data).forEach((cat) => {
        const card = document.createElement("div");
        card.className = "home-card";
        card.innerHTML = "<h3>" + cat + "</h3><p>" + data[cat].description + "</p>";
        card.onclick = () => {
          activeCategory = cat;
          activeSub = Object.keys(data[cat].subs)[0];
          renderTopNav();
          renderCategory();
          showState("category");
        };
        homeCards.appendChild(card);
      });
    }

    function renderCategory() {
      subLabel.textContent = activeCategory;
      catHeading.textContent = activeSub;
      catDescription.textContent = data[activeCategory].description;
      subMenu.innerHTML = "";
      Object.keys(data[activeCategory].subs).forEach((sub) => {
        const btn = document.createElement("button");
        btn.className = "sub-btn" + (sub === activeSub ? " active" : "");
        btn.textContent = sub;
        btn.onclick = () => { activeSub = sub; renderCategory(); };
        subMenu.appendChild(btn);
      });
      catGrid.innerHTML = "";
      data[activeCategory].subs[activeSub].forEach((item) => {
        const isLive = item.status === "운영중";
        const card = document.createElement("article");
        card.className = "service-card";
        card.innerHTML = "<div class='card-kicker'>SERVICE</div>" +
          "<div class='card-title'>" + item.title + "</div>" +
          "<div class='card-desc'>" + item.desc + "</div>" +
          "<span class='status-badge " + (isLive ? "status-live" : "status-ready") + "'>" + item.status + "</span>";
        card.onclick = () => openDetail(item);
        catGrid.appendChild(card);
      });
    }

    function openDetail(item) {
      document.getElementById("detailTitle").textContent = item.title;
      document.getElementById("detailParagraph1").textContent = item.desc + " 이 서비스는 실제 운영 환경에서 바로 적용할 수 있도록 구조화되어 있습니다.";
      document.getElementById("detailParagraph2").textContent = "현재 상황과 목표를 기반으로 우선순위를 정리하고, 단계별 실행 계획으로 연결해드립니다.";
      detailFeatures.innerHTML =
        "<li>요구사항 분석과 실행 범위 정리</li>" +
        "<li>운영중인 시스템과 연결 가능한 구조 제안</li>" +
        "<li>초기 세팅부터 점검까지 단계별 가이드 제공</li>";
      showState("detail");
    }

    function openLoginModal() { loginModal.classList.add("open"); }
    function closeLoginModal() { loginModal.classList.remove("open"); }

    document.getElementById("goHomeBtn").onclick = () => showState("home");
    document.getElementById("goSalesBtn").onclick = () => window.location.href = "gnova_sales_suite.html";
    document.getElementById("signInBtn").onclick = openLoginModal;
    document.getElementById("darkBtn").onclick = () => document.body.classList.toggle("dark");
    document.getElementById("backHomeBtn").onclick = () => showState("home");
    document.getElementById("backCatBtn").onclick = () => showState("category");
    document.getElementById("detailCtaBtn").onclick = openLoginModal;
    document.getElementById("closeModalX").onclick = closeLoginModal;
    loginModal.addEventListener("click", (e) => { if (e.target === loginModal) closeLoginModal(); });
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => { document.getElementById("searchInput").value = chip.textContent; });
    });
    document.getElementById("searchSendBtn").onclick = () => {
      activeCategory = "서비스 안내"; activeSub = "부동산 스테이징";
      renderTopNav(); renderCategory(); showState("category");
    };

    renderTopNav();
    renderHomeCards();
    renderCategory();
    showState("home");

    // ═══════════════════════════════════════════
    // G-NOVA LABS FRONTEND LOGIC
    // ═══════════════════════════════════════════
  </script>
</body>
