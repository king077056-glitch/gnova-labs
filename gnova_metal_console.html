<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>G-NOVA LABS</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}:root{--cream:#EDEBE3;--ink:#1A1A18;--purple:#7C3AED;--muted:#6B6B63;--border:rgba(26,26,24,0.1);--surface:rgba(237,235,227,0.9)}body.dark{--cream:#0F0F0D;--ink:#F0EEE6;--purple:#A78BFA;--muted:#8A8A82;--border:rgba(240,238,230,0.1);--surface:rgba(15,15,13,0.9)}html,body{width:100%;height:100%;overflow:hidden;font-family:Pretendard,-apple-system,sans-serif;background:var(--cream);color:var(--ink);transition:background .4s,color .4s}.header{height:64px;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 40px;position:relative;z-index:100}.header-left{flex:1}.logo-btn{border:none;background:transparent;cursor:pointer;padding:0}.logo-btn img{height:44px;width:auto;display:block}.top-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:40px}.nav-btn{border:none;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;padding:6px 0;position:relative;font-family:inherit}.nav-btn:hover,.nav-btn.active{color:var(--ink)}.nav-btn::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--purple);transition:width .3s}.nav-btn.active::after{width:100%}.header-right{flex:1;display:flex;gap:12px;align-items:center;justify-content:flex-end}.btn-line{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;font-size:14px;font-weight:600;height:38px;padding:0 18px;cursor:pointer;font-family:inherit;transition:all .2s}.btn-line:hover{background:var(--border)}.btn-fill{border:none;background:var(--ink);color:var(--cream);border-radius:999px;font-size:14px;font-weight:700;height:38px;padding:0 20px;cursor:pointer;font-family:inherit;transition:all .2s}.btn-fill:hover{transform:translateY(-1px)}.app{position:relative;width:100%;height:calc(100vh - 64px);overflow:hidden}.state{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(8px);transition:all .4s cubic-bezier(.4,0,.2,1)}.state.active{opacity:1;pointer-events:auto;transform:translateY(0)}.hero-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}.hero-left{padding:60px 64px;display:flex;flex-direction:column;justify-content:center;gap:32px}.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:999px;padding:6px 14px;width:fit-content}.hero-h1{font-family:"Playfair Display",serif;font-size:52px;font-weight:900;line-height:1.1;color:var(--ink);letter-spacing:-.02em}.hero-h1 em{color:var(--purple);font-style:italic}.hero-sub{font-size:17px;color:var(--muted);line-height:1.7;max-width:460px}.hero-actions{display:flex;gap:16px;align-items:center}.cta-primary{height:52px;background:var(--purple);color:#fff;border:none;border-radius:12px;padding:0 28px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}.cta-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.35)}.cta-secondary{height:52px;border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:12px;padding:0 28px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}.cta-secondary:hover{background:var(--border)}.stats-row{display:flex;gap:40px;padding-top:16px;border-top:1px solid var(--border)}.stat-item{display:flex;flex-direction:column;gap:4px}.stat-num{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;color:var(--ink)}.stat-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero-right{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}canvas#heroCanvas{width:100%;height:100%;display:block}.cat-layout{height:100%;display:grid;grid-template-columns:260px 1fr;background:var(--cream)}.sidebar{background:rgba(237,235,227,.6);border-right:1px solid var(--border);padding:40px 20px;display:flex;flex-direction:column;overflow-y:auto;backdrop-filter:blur(20px)}.back-home{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;width:fit-content;margin-bottom:32px;font-family:inherit}.back-home:hover{background:var(--border)}.sub-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;padding-left:12px}.sub-btn{width:100%;border:none;background:transparent;text-align:left;color:var(--muted);font-size:15px;font-weight:500;padding:12px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:2px;font-family:inherit}.sub-btn:hover{background:var(--border);color:var(--ink)}.sub-btn.active{background:var(--ink);color:var(--cream);font-weight:700}.cat-main{padding:56px 64px;overflow-y:auto}.cat-main h1{font-family:"Playfair Display",serif;font-size:36px;font-weight:700;color:var(--ink);margin-bottom:12px}.cat-main p{font-size:16px;color:var(--muted);margin-bottom:40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.service-card{background:rgba(237,235,227,.5);border:1px solid var(--border);border-radius:20px;padding:28px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1)}.service-card:hover{transform:translateY(-4px);border-color:var(--purple);box-shadow:0 12px 32px rgba(0,0,0,.06)}.card-kicker{font-size:11px;font-weight:800;color:var(--purple);letter-spacing:.1em;margin-bottom:12px}.card-title{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}.card-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px}.status-badge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}.status-live{background:rgba(52,199,89,.12);color:#16a34a}.status-ready{background:var(--border);color:var(--muted)}.detail{height:100%;display:grid;grid-template-columns:1fr 420px;background:var(--cream)}.detail-left{padding:56px 64px;overflow-y:auto;border-right:1px solid var(--border)}.detail-right{padding:48px 40px;overflow-y:auto;background:rgba(237,235,227,.5);backdrop-filter:blur(20px)}.back-detail{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:36px;transition:all .2s;width:fit-content;font-family:inherit}.back-detail:hover{background:var(--border)}.detail-title{font-family:"Playfair Display",serif;font-size:42px;font-weight:900;color:var(--ink);margin-bottom:20px;letter-spacing:-.02em}.detail-divider{width:56px;height:3px;background:var(--purple);margin:20px 0 36px;border-radius:2px}.detail-left h2{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:16px}.detail-left p{font-size:17px;color:var(--muted);line-height:1.8;margin-bottom:24px;max-width:680px}.feature-list{list-style:none;padding:0}.feature-list li{position:relative;padding-left:28px;font-size:16px;color:var(--ink);line-height:1.6;margin-bottom:14px}.feature-list li::before{content:"✦";position:absolute;left:0;color:var(--purple)}.form-card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:0 8px 32px rgba(0,0,0,.04)}.body.dark .form-card{background:rgba(30,30,28,1)}.form-card h3{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:24px}.form-group{display:flex;flex-direction:column;gap:14px}.form-group input,.form-group textarea{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:16px;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s;font-family:inherit}.form-group input:focus,.form-group textarea:focus{border-color:var(--purple)}.form-group textarea{min-height:140px;resize:vertical}.submit-btn{height:52px;border:none;border-radius:12px;background:var(--purple);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px;font-family:inherit}.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.35)}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,26,24,.6);backdrop-filter:blur(12px);z-index:1000;padding:20px}.modal.open{display:flex;animation:fadeIn .3s}.modal-card{width:100%;max-width:420px;background:var(--cream);border:1px solid var(--border);border-radius:28px;padding:44px;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.15);animation:slideUp .3s cubic-bezier(.4,0,.2,1)}.close-x{position:absolute;top:20px;right:20px;width:32px;height:32px;border:none;background:var(--border);color:var(--ink);border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}.modal-card h3{font-family:"Playfair Display",serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:28px;text-align:center}.login-btn{width:100%;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;padding:16px;cursor:pointer;margin-bottom:10px;transition:all .2s;font-family:inherit}.login-btn:hover{background:var(--border)}.divider{height:1px;background:var(--border);margin:24px 0;position:relative}.divider::after{content:"OR";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--cream);padding:0 12px;color:var(--muted);font-size:13px;font-weight:600}.email-group{display:flex;flex-direction:column;gap:10px}.email-group input{height:52px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.5);color:var(--ink);padding:0 16px;font-size:15px;outline:none;transition:border-color .2s;font-family:inherit}.email-group input:focus{border-color:var(--purple)}.email-group .submit{height:52px;border:none;border-radius:12px;background:var(--ink);color:var(--cream);font-weight:700;font-size:16px;cursor:pointer;transition:all .2s;font-family:inherit}.email-group .submit:hover{transform:translateY(-1px)}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}</style></head><body><header class="header"><div class="header-left"><button class="logo-btn" id="goHomeBtn" title="홈"><img src="gnova_hypercar_logo_transparent.png" alt="G-NOVA"></button></div><nav class="top-nav" id="topNav"></nav><div class="header-right"><button class="btn-line" id="goSalesBtn">템플릿 판매</button><button class="btn-line" id="darkBtn">다크모드</button><button class="btn-fill" id="signInBtn">로그인</button></div></header><main class="app"><section class="state active" id="stateHome"><div class="hero-layout"><div class="hero-left"><div class="hero-tag"><span>● LIVE</span> G-NOVA AI 플랫폼</div><h1 class="hero-h1">AI가 당신의<br>비즈니스를<br><em>다시 씁니다.</em></h1><p class="hero-sub">가상 스테이징부터 블로그 자동화, AI 컨설팅, 경매 분석까지 — G-NOVA가 실행합니다.</p><div class="hero-actions"><button class="cta-primary" id="searchSendBtn">서비스 시작하기 →</button><button class="cta-secondary">포트폴리오 보기</button></div><div class="stats-row"><div class="stat-item"><div class="stat-num">480+</div><div class="stat-label">완료 프로젝트</div></div><div class="stat-item"><div class="stat-num">2,412</div><div class="stat-label">생성 이미지</div></div><div class="stat-item"><div class="stat-num">15분</div><div class="stat-label">평균 납기</div></div></div></div><div class="hero-right"><canvas id="heroCanvas"></canvas></div></div></section><section class="state" id="stateCategory"><div class="cat-layout"><aside class="sidebar"><button class="back-home" id="backHomeBtn">← 홈으로</button><div class="sub-label" id="subLabel">서비스 안내</div><div id="subMenu"></div></aside><div class="cat-main"><h1 id="catHeading">서비스 안내</h1><p id="catDescription">소카테고리를 선택하면 상세 항목을 확인할 수 있습니다.</p><div class="grid" id="catGrid"></div></div></div></section><section class="state" id="stateDetail"><div class="detail"><div class="detail-left"><button class="back-detail" id="backCatBtn">← 뒤로</button><h1 class="detail-title" id="detailTitle"></h1><div class="detail-divider"></div><h2>상세 안내</h2><p id="detailParagraph1"></p><p id="detailParagraph2"></p><ul class="feature-list" id="detailFeatures"></ul></div><div class="detail-right"><div class="form-card"><h3>상담 신청</h3><div class="form-group"><input placeholder="이름"><input placeholder="연락처"><textarea placeholder="문의내용"></textarea><button class="submit-btn" id="detailCtaBtn">무료 상담 신청</button></div></div></div></div></section></main><div class="modal" id="loginModal"><div class="modal-card"><button class="close-x" id="closeModalX">✕</button><h3>로그인</h3><button class="login-btn">Google 로그인</button><button class="login-btn">Naver 로그인</button><button class="login-btn">Kakao 로그인</button><div class="divider"></div><div class="email-group"><input placeholder="이메일"><input placeholder="비밀번호" type="password"><button class="submit">로그인</button></div></div></div><script>const data={"서비스 안내":{description:"운영중 서비스와 준비중 항목을 확인하세요.",subs:{"부동산 스테이징":[{title:"매물 사진 고급화",desc:"매물 사진을 판매용 비주얼로 고급화합니다.",status:"운영중"},{title:"상담 전환 랜딩",desc:"문의 유입 중심 랜딩 구조를 제공합니다.",status:"운영중"}],"블로그 자동화":[{title:"키워드 기반 글 생성",desc:"핵심 키워드로 자동 글 초안을 생성합니다.",status:"운영중"},{title:"콘텐츠 일정 운영",desc:"지속 발행을 위한 운영 흐름을 지원합니다.",status:"운영중"}],"기업 웹사이트":[{title:"신뢰형 메인 페이지",desc:"기업 신뢰 중심의 메인 페이지를 구축합니다.",status:"운영중"},{title:"문의 중심 구성",desc:"상담 전환률에 초점을 맞춘 구조입니다.",status:"운영중"}],"이미지 자동화 (준비중)":[{title:"썸네일 자동 제작",desc:"채널별 썸네일 제작 자동화를 준비중입니다.",status:"준비중"},{title:"제품컷 보정",desc:"상품컷 자동 보정 기능을 준비중입니다.",status:"준비중"}],"영상 생성 자동화 (준비중)":[{title:"숏폼 자동 생성",desc:"짧은 홍보 영상 자동 생성 기능을 준비중입니다.",status:"준비중"},{title:"자막/포맷 변환",desc:"플랫폼별 자막/비율 자동 변환 기능을 준비중입니다.",status:"준비중"}]}},"무료 프롬프트":{description:"이미지/영상 생성용 무료 프롬프트 카테고리입니다.",subs:{"이미지 프롬프트":[{title:"브랜드형 이미지 프롬프트",desc:"브랜드 톤 기반 이미지 생성용 기본 템플릿.",status:"운영중"},{title:"제품 컷 프롬프트",desc:"상세페이지 제품 컷 생성용 템플릿.",status:"운영중"}],"영상 프롬프트":[{title:"숏폼 영상 프롬프트",desc:"15~30초 숏폼 제작용 템플릿.",status:"운영중"},{title:"리뷰/후기 영상 프롬프트",desc:"후기 중심 영상 구성 템플릿.",status:"운영중"}]}}};let activeCategory="서비스 안내",activeSub="부동산 스테이징";const stateHome=document.getElementById("stateHome"),stateCategory=document.getElementById("stateCategory"),stateDetail=document.getElementById("stateDetail"),topNav=document.getElementById("topNav"),subLabel=document.getElementById("subLabel"),subMenu=document.getElementById("subMenu"),catHeading=document.getElementById("catHeading"),catDescription=document.getElementById("catDescription"),catGrid=document.getElementById("catGrid"),detailFeatures=document.getElementById("detailFeatures"),loginModal=document.getElementById("loginModal");function showState(t){stateHome.classList.remove("active");stateCategory.classList.remove("active");stateDetail.classList.remove("active");if(t==="home")stateHome.classList.add("active");else if(t==="category")stateCategory.classList.add("active");else if(t==="detail")stateDetail.classList.add("active")}function renderTopNav(){topNav.innerHTML="";Object.keys(data).forEach(cat=>{const btn=document.createElement("button");btn.className="nav-btn"+(cat===activeCategory?" active":"");btn.textContent=cat;btn.onclick=()=>{activeCategory=cat;activeSub=Object.keys(data[cat].subs)[0];renderTopNav();renderCategory();showState("category")};topNav.appendChild(btn)})}function renderCategory(){subLabel.textContent=activeCategory;catHeading.textContent=activeSub;catDescription.textContent=data[activeCategory].description;subMenu.innerHTML="";Object.keys(data[activeCategory].subs).forEach(sub=>{const btn=document.createElement("button");btn.className="sub-btn"+(sub===activeSub?" active":"");btn.textContent=sub;btn.onclick=()=>{activeSub=sub;renderCategory()};subMenu.appendChild(btn)});catGrid.innerHTML="";data[activeCategory].subs[activeSub].forEach(item=>{const isLive=item.status==="운영중";const card=document.createElement("article");card.className="service-card";card.innerHTML="<div class=card-kicker>SERVICE</div><div class=card-title>"+item.title+"</div><div class=card-desc>"+item.desc+"</div><span class=\"status-badge "+(isLive?"status-live":"status-ready")+"\">"+item.status+"</span>";card.onclick=()=>openDetail(item);catGrid.appendChild(card)})}function openDetail(item){document.getElementById("detailTitle").textContent=item.title;document.getElementById("detailParagraph1").textContent=item.desc+" 이 서비스는 실제 운영 환경에서 바로 적용할 수 있도록 구조화되어 있습니다.";document.getElementById("detailParagraph2").textContent="현재 상황과 목표를 기반으로 우선순위를 정리하고, 단계별 실행 계획으로 연결해드립니다.";detailFeatures.innerHTML="<li>요구사항 분석과 실행 범위 정리</li><li>운영중인 시스템과 연결 가능한 구조 제안</li><li>초기 세팅부터 점검까지 단계별 가이드 제공</li>";showState("detail")}function openLoginModal(){loginModal.classList.add("open")}function closeLoginModal(){loginModal.classList.remove("open")}document.getElementById("goHomeBtn").onclick=()=>showState("home");document.getElementById("goSalesBtn").onclick=()=>{activeCategory="무료 프롬프트";activeSub=Object.keys(data[activeCategory].subs)[0];renderTopNav();renderCategory();showState("category")};document.getElementById("signInBtn").onclick=openLoginModal;document.getElementById("darkBtn").onclick=()=>document.body.classList.toggle("dark");document.getElementById("backHomeBtn").onclick=()=>showState("home");document.getElementById("backCatBtn").onclick=()=>showState("category");document.getElementById("detailCtaBtn").onclick=openLoginModal;document.getElementById("closeModalX").onclick=closeLoginModal;loginModal.addEventListener("click",e=>{if(e.target===loginModal)closeLoginModal()});document.getElementById("searchSendBtn").onclick=()=>{activeCategory="서비스 안내";activeSub="부동산 스테이징";renderTopNav();renderCategory();showState("category")};renderTopNav();renderCategory();showState("home");const canvas=document.getElementById("heroCanvas");const ctx=canvas.getContext("2d");let W,H,particles=[];function resize(){W=canvas.width=canvas.offsetWidth;H=canvas.height=canvas.offsetHeight}resize();window.addEventListener("resize",resize);class Particle{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*2+.5;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.alpha=Math.random()*.6+.2}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset()}}for(let i=0;i<120;i++)particles.push(new Particle);let angle=0;function draw(){ctx.clearRect(0,0,W,H);const isDark=document.body.classList.contains("dark");const bg1=isDark?"rgba(124,58,237,0.06)":"rgba(124,58,237,0.08)";const pc=isDark?"rgba(124,58,237,":"rgba(26,26,24,";const lc=isDark?"rgba(124,58,237,0.15)":"rgba(124,58,237,0.12)";const grd=ctx.createRadialGradient(W*.7,H*.4,0,W*.7,H*.4,W*.6);grd.addColorStop(0,isDark?"rgba(124,58,237,0.15)":"rgba(124,58,237,0.1)");grd.addColorStop(1,"transparent");ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);particles.forEach(p=>{p.update();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=pc+p.alpha+")";ctx.fill()});for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<80){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=lc;ctx.lineWidth=.5;ctx.stroke()}}}angle+=.005;const cx=W*.5+Math.cos(angle)*W*.05,cy=H*.5+Math.sin(angle)*H*.05,rad=Math.min(W,H)*.18;for(let s=0;s<6;s++){const a=angle+s*(Math.PI/3),x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad,nx=cx+Math.cos(a+Math.PI/3)*rad,ny=cy+Math.sin(a+Math.PI/3)*rad;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle=isDark?"rgba(167,139,250,0.25)":"rgba(124,58,237,0.2)";ctx.lineWidth=1;ctx.stroke()}requestAnimationFrame(draw)}draw()</script></body></html>
